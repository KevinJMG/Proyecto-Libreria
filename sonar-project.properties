# SonarCloud project configuration.
# sonar.organization / sonar.projectKey come from your SonarCloud project
# (sonarcloud.io -> Administration -> General Settings) after you create it —
# replace the placeholders below with the real values.
sonar.organization=CHANGE_ME_ORGANIZATION_KEY
sonar.projectKey=CHANGE_ME_PROJECT_KEY

sonar.sources=src
sonar.tests=src
sonar.test.inclusions=src/**/*.test.ts,src/**/*.test.tsx

# Vendored shadcn/ui primitives, the router-generated file, and page/route
# components (JSX-heavy orchestration, exercised by manual QA rather than
# unit tests) are excluded from analysis entirely — same scope as
# vitest.config.ts's coverage config.
sonar.exclusions=src/components/ui/**,src/routeTree.gen.ts,src/routes/**

# Framework bootstrap/wiring and trivial passthroughs have no meaningful
# logic to cover; kept in analysis for smells/complexity, just not counted
# against the coverage percentage.
sonar.coverage.exclusions=src/router.tsx,src/server.ts,src/start.ts,src/lib/supabase.ts,src/lib/lovable-error-reporting.ts,src/**/*.test.ts,src/**/*.test.tsx,src/test/**

sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.sourceEncoding=UTF-8
